name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[lab,dev]"
      - run: ruff check src tests examples
      - run: mypy src

  test:
    # No credentials, no cloud: Colab tests are opt-in (LABPILOT_COLAB_SMOKE=1) and skipped here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install LabPilot
        run: python -m pip install -e ".[lab,dev]"
      - name: Install headless Chromium (screenshots)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration and end-to-end tests (real kernel + browser)
        run: python -m pytest tests/integration tests/e2e -q
