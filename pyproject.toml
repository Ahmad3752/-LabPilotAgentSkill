[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "labpilot"
version = "0.1.0"
description = "Local-first agent skill and CLI that executes programming lab manuals and fills a copy of the original Word document with real evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LabPilot contributors" }]
keywords = ["jupyter", "docx", "lab", "agent-skill", "codex", "claude-code", "colab"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
# Tested versions (see docs/IMPLEMENTATION_STATUS.md). Lower bounds are the
# oldest versions we rely on; upper bounds guard against untested majors.
dependencies = [
  "python-docx>=1.1,<2",
  "nbformat>=5.9,<6",
  "nbclient>=0.10,<0.12",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<8",
  "jupyter_client>=8.6,<9",
  "playwright>=1.48,<2",
  "pillow>=10.4,<14",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# Packages the generated lab code typically imports in the local kernel.
lab = ["pandas>=2.1", "matplotlib>=3.8", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
labpilot = "labpilot.cli:main"

[project.urls]
Homepage = "https://github.com/Ahmad3752/-LabPilotAgentSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]

[tool.hatch.build.targets.wheel.force-include]
"skills/labpilot" = "labpilot/_skill/labpilot"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "scripts", "docs", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real local Jupyter kernel and/or headless Chromium",
  "e2e: full pipeline from .docx to completed artifacts",
  "cloud: opt-in real Google Colab smoke test (LABPILOT_COLAB_SMOKE=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",  # assert is fine in tests and in invariants
  "S603",  # subprocess with argument lists is the intended design
  "S607",  # executables are resolved from PATH deliberately (colab, wsl, powershell)
  "S404",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
